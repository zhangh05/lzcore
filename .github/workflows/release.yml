name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose assets should be rebuilt from this ref (tag is unchanged)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6

      - name: Validate existing release target
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (Select-String -Path agent/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Existing release tag must match the code version' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate pushed tag matches code version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path agent/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match code version v$version" }

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-desktop.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows platform tests
        shell: pwsh
        run: |
          python -m pytest -q harness/platform/test_windows_runtime_contract.py harness/platform/test_desktop_app.py harness/platform/test_windows_desktop_update.py harness/platform/test_windows_packaging.py harness/api/test_session_management.py harness/storage/test_storage_filestore_foundation.py harness/storage/test_file_workflow_contract.py harness/api/test_ws_agent_contract.py harness/llm/test_llm_stream_tool_calls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and verify Microsoft WebView2
        shell: pwsh
        run: ./scripts/download_webview2.ps1

      - name: Build desktop application
        shell: pwsh
        env:
          LZCORE_SIGNING_PFX: ${{ secrets.LZCORE_SIGNING_PFX }}
          LZCORE_SIGNING_PASSWORD: ${{ secrets.LZCORE_SIGNING_PASSWORD }}
        run: |
          python packaging/windows/build.py build --webview2 "$env:LZCORE_WEBVIEW2_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the real portable application
        shell: pwsh
        run: |
          python packaging/windows/smoke.py --exe dist/lzcore/lzcore.exe --mode portable --output "$env:RUNNER_TEMP/desktop-qa/portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable ZIP and installer
        shell: pwsh
        env:
          LZCORE_SIGNING_PFX: ${{ secrets.LZCORE_SIGNING_PFX }}
          LZCORE_SIGNING_PASSWORD: ${{ secrets.LZCORE_SIGNING_PASSWORD }}
        run: |
          python packaging/windows/build.py package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify install, upgrade and uninstall keep user data
        shell: pwsh
        run: |
          $version = (Select-String -Path agent/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          $setup = (Resolve-Path "release/lzcore-v$version-windows-setup.exe").Path
          $target = Join-Path $env:RUNNER_TEMP '中文 安装目录/LZCore'
          $installArguments = @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART', ('/DIR="' + $target + '"'),'/TASKS=')
          $install = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installation failed" }
          if (Test-Path (Join-Path $target 'portable.json')) { throw 'Installed mode marker is wrong' }
          python packaging/windows/smoke.py --exe "$target/lzcore.exe" --mode installed --output "$env:RUNNER_TEMP/desktop-qa/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Mixing installed and portable modes would change the data path.
          $marker = Join-Path $target 'portable.json'
          Set-Content -LiteralPath $marker -Value '{}' -Encoding UTF8
          $mixed = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($mixed.ExitCode -eq 0 -or -not (Test-Path $marker)) { throw 'Mixed-mode installation was not safely refused' }
          Remove-Item -LiteralPath $marker
          # Upgrade must replace stale runtime files instead of mixing versions.
          $stale = Join-Path $target '_internal/stale-from-old-version.txt'
          Set-Content -LiteralPath $stale -Value 'old' -Encoding UTF8
          $upgrade = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw 'Upgrade failed' }
          if (Test-Path $stale) { throw 'Upgrade left files from the previous version' }
          $sentinel = Join-Path $env:RUNNER_TEMP 'desktop-qa/installed/中文 用户数据/sentinel.txt'
          if (-not (Test-Path $sentinel)) { throw 'Upgrade removed data' }
          $uninstall = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or -not (Test-Path $sentinel)) { throw 'Uninstall did not preserve data' }
          if (Test-Path (Join-Path $target '_internal')) { throw 'Uninstall left program files behind' }

      - name: Upload native desktop validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-validation
          path: |
            ${{ runner.temp }}/desktop-qa/*/*.png
            ${{ runner.temp }}/desktop-qa/*/*.json
            ${{ runner.temp }}/desktop-qa/*/native-errors.txt
            ${{ runner.temp }}/desktop-qa/*/中文 用户数据/logs/*.log
            build/windows/bundle.json
          if-no-files-found: warn

      - name: Preserve verified Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-packages
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            release/lzcore-*-windows-portable.zip
            release/lzcore-*-windows-setup.exe
            release/windows-update.json
            release/SHA256SUMS.txt

  publish:
    needs: windows-package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-release-packages
          path: release
      - name: Upload existing draft or create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "联智中枢 $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
