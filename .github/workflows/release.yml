name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose assets should be rebuilt from this ref (tag is unchanged)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate existing release target
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (Select-String -Path agent/__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Existing release tag must match the code version' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.12
        id: python312
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Python 3.13
        id: python313
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build offline Python dependency cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wheelhouse | Out-Null
          & "${{ steps.python312.outputs.python-path }}" -m pip download --only-binary=:all: --dest wheelhouse -r requirements.txt
          & "${{ steps.python313.outputs.python-path }}" -m pip download --only-binary=:all: --dest wheelhouse -r requirements.txt

      - name: Verify dependency cache offline
        shell: pwsh
        run: |
          foreach ($runtime in @(
            @{ Name = "3.12"; Python = "${{ steps.python312.outputs.python-path }}" },
            @{ Name = "3.13"; Python = "${{ steps.python313.outputs.python-path }}" }
          )) {
            $venv = Join-Path $env:RUNNER_TEMP "lzcore-wheelhouse-$($runtime.Name)"
            $runtimePython = $runtime.Python
            & $runtimePython -m venv $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $python = Join-Path $venv "Scripts/python.exe"
            & $python -m pip install --disable-pip-version-check --no-index --find-links wheelhouse -r requirements.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m pip check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -c "import flask, flask_sock, yaml, bs4, lxml, pdfplumber, paramiko"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m pytest -q harness/test_windows_runtime_contract.py harness/test_session_management.py harness/test_storage_filestore_foundation.py harness/test_turn_replay.py harness/test_turn_closeout.py harness/test_replay_persist_fault.py harness/test_stream_secret_buffer.py harness/test_ws_agent_contract.py harness/test_ws_system_broadcast.py harness/test_context_memory_repairs.py harness/test_workspace_source_creation.py harness/test_observation_freshness.py harness/test_reasoning_protocol_continuity.py harness/test_runtime_recovery_hardening.py harness/test_provider_catalog.py harness/test_llm_stream_tool_calls.py harness/test_synthesis_recovery.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate Windows launch scripts
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "start.ps1"), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          .\start.ps1 -NoBrowser -ValidateOnly
          foreach ($script in @('stop.ps1','scripts/windows_update.ps1','scripts/windows_dialog_smoke.ps1','scripts/download_webview2.ps1','scripts/sign_windows.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "release/lzcore"
          New-Item -ItemType Directory -Force $stage | Out-Null
          robocopy $PWD $stage /E /XD .git .github .venv .runtime node_modules logs data workspaces reports release frontend\test-results frontend\playwright-report /XF .backend.pid .frontend.pid *.log | Out-Null
          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -ge 8) { exit $robocopyExitCode }

          Remove-Item -Recurse -Force (Join-Path $stage "config")
          New-Item -ItemType Directory -Force (Join-Path $stage "config") | Out-Null
          Get-ChildItem config -File | Where-Object { $_.Name -like '*.example*' -or $_.Name -eq 'logging.yaml' } | Copy-Item -Destination (Join-Path $stage "config")

          # A Windows release is self-contained: users only extract the archive
          # and double-click start.bat. Bundle the verified Python runtime,
          # Node executable, and Vite runtime dependencies.
          $pythonRoot = Split-Path "${{ steps.python312.outputs.python-path }}" -Parent
          $runtimePython = Join-Path $stage "runtime/python"
          $runtimeNode = Join-Path $stage "runtime/node"
          New-Item -ItemType Directory -Force $runtimePython, $runtimeNode | Out-Null
          robocopy $pythonRoot $runtimePython /E | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }

          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          Copy-Item $nodePath (Join-Path $runtimeNode "node.exe") -Force
          robocopy (Join-Path $PWD "frontend/node_modules") (Join-Path $stage "frontend/node_modules") /E | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }

          $bundledPython = Join-Path $runtimePython "python.exe"
          & $bundledPython -m pip install --disable-pip-version-check --no-index --find-links (Join-Path $stage "wheelhouse") -r (Join-Path $stage "requirements.txt")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bundledPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bundledPython -c "import flask, flask_sock, yaml, bs4, lxml, pdfplumber, paramiko"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & (Get-Command pwsh.exe -ErrorAction Stop).Source -NoProfile -File (Join-Path $stage "start.ps1") -NoBrowser -ValidateOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Dependencies are installed into the portable runtime, so the large
          # wheel cache is no longer needed in the user-facing archive.
          Remove-Item -Recurse -Force (Join-Path $stage "wheelhouse")

          # Robocopy uses 1-7 for successful copy states. Reset the native exit
          # code so GitHub's pwsh wrapper does not mark the step as failed.
          $global:LASTEXITCODE = 0
          $version = "v$(& '${{ steps.python312.outputs.python-path }}' -c 'from agent import __version__; print(__version__)')"
          Compress-Archive -Path $stage -DestinationPath "release/lzcore-$version-windows-x64.zip" -Force

      - name: Install locked desktop dependencies
        shell: pwsh
        run: |
          & "${{ steps.python312.outputs.python-path }}" -m pip install --disable-pip-version-check -r requirements-desktop.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ steps.python312.outputs.python-path }}" -m pytest -q harness/test_desktop_app.py harness/test_windows_desktop_update.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and verify Microsoft WebView2
        shell: pwsh
        run: ./scripts/download_webview2.ps1

      - name: Build desktop EXE
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          LZCORE_SIGNING_PFX: ${{ secrets.LZCORE_SIGNING_PFX }}
        run: |
          & "${{ steps.python312.outputs.python-path }}" scripts/build_windows_exe.py --webview2-runtime "$env:LZCORE_WEBVIEW2_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign desktop executable when configured
        shell: pwsh
        env:
          LZCORE_SIGNING_PFX: ${{ secrets.LZCORE_SIGNING_PFX }}
          LZCORE_SIGNING_PASSWORD: ${{ secrets.LZCORE_SIGNING_PASSWORD }}
        run: ./scripts/sign_windows.ps1 -File dist/lzcore/lzcore.exe

      - name: Test actual portable desktop
        shell: pwsh
        run: |
          & "${{ steps.python312.outputs.python-path }}" scripts/windows_desktop_smoke.py --exe dist/lzcore/lzcore.exe --mode portable --output "$env:RUNNER_TEMP/desktop-qa/portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Smoke data is outside the program folder; no user data enters ZIP.
          Compress-Archive -Path dist/lzcore -DestinationPath "release/lzcore-v$( & '${{ steps.python312.outputs.python-path }}' -c 'from agent import __version__; print(__version__)')-windows-portable.zip" -Force

      - name: Build per-user installer
        shell: pwsh
        env:
          LZCORE_SIGNING_PFX: ${{ secrets.LZCORE_SIGNING_PFX }}
          LZCORE_SIGNING_PASSWORD: ${{ secrets.LZCORE_SIGNING_PASSWORD }}
        run: |
          $version = & "${{ steps.python312.outputs.python-path }}" -c "from agent import __version__; print(__version__)"
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler unavailable" }
          $arguments = @("/DAppVersion=$version", 'scripts/windows_installer.iss')
          if ($env:LZCORE_SIGNING_PFX) {
            $sign = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "' + (Join-Path $PWD 'scripts/sign_windows.ps1') + '" -File $f'
            $arguments = @("/DAppVersion=$version", "/DSignCommand=$sign", 'scripts/windows_installer.iss')
          }
          & $compiler @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify install, upgrade and uninstall data retention
        shell: pwsh
        run: |
          $version = & "${{ steps.python312.outputs.python-path }}" -c "from agent import __version__; print(__version__)"
          $setup = (Resolve-Path "release/lzcore-v$version-windows-setup.exe").Path
          $target = Join-Path $env:RUNNER_TEMP '中文 安装目录/LZCore'
          $installArguments = @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART', ('/DIR="' + $target + '"'),'/TASKS=')
          $install = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installation failed" }
          if (Test-Path (Join-Path $target 'portable.json')) { throw 'Installed mode marker is wrong' }
          & "${{ steps.python312.outputs.python-path }}" scripts/windows_desktop_smoke.py --exe "$target/lzcore.exe" --mode installed --output "$env:RUNNER_TEMP/desktop-qa/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Mixing installed and portable modes would change the data path.
          # Refuse the directory without removing its marker or user files.
          $marker = Join-Path $target 'portable.json'
          Set-Content -LiteralPath $marker -Value '{}' -Encoding UTF8
          $mixed = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($mixed.ExitCode -eq 0 -or -not (Test-Path $marker)) { throw 'Mixed-mode installation was not safely refused' }
          Remove-Item -LiteralPath $marker
          $upgrade = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw 'Upgrade failed' }
          $sentinel = Join-Path $env:RUNNER_TEMP 'desktop-qa/installed/中文 用户数据/sentinel.txt'
          if (-not (Test-Path $sentinel)) { throw 'Upgrade removed data' }
          $uninstall = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or -not (Test-Path $sentinel)) { throw 'Uninstall did not preserve data' }
          & "${{ steps.python312.outputs.python-path }}" scripts/windows_release_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native desktop validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-validation
          path: |
            ${{ runner.temp }}/desktop-qa/*/*.png
            ${{ runner.temp }}/desktop-qa/*/startup.json
            ${{ runner.temp }}/desktop-qa/*/result.json
            ${{ runner.temp }}/desktop-qa/*/native-errors.txt
          if-no-files-found: warn

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release/lzcore-*.zip
            release/lzcore-*-setup.exe
            release/windows-update.json
            release/SHA256SUMS.txt
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
