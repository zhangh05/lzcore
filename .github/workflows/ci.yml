name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full:
        description: Run all CI jobs and complete browser coverage
        required: false
        default: false
        type: boolean
      browser_spec:
        description: Browser spec to rerun in development and production (only frontend-e2e runs)
        required: false
        default: 34-file-workspace
        type: string

jobs:
  frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.full == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit, test and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit
          npm --prefix frontend run lint:tokens
          npm --prefix frontend run lint:styles
          npm --prefix frontend test -- --run
          npm --prefix frontend run build

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm --prefix frontend ci
          npm --prefix frontend run e2e:install
      - name: Exercise authenticated workbench in Chromium
        env:
          E2E_PYTHON_BIN: python
          E2E_SPEC: ${{ inputs.full != true && inputs.browser_spec || '' }}
        run: |
          if [ -n "$E2E_SPEC" ]; then
            npm --prefix frontend run e2e -- "$E2E_SPEC"
          else
            npm --prefix frontend run e2e
          fi
      - name: Verify production CSS and visual flows
        env:
          E2E_PYTHON_BIN: python
          E2E_PRODUCTION: "1"
          E2E_SPEC: ${{ inputs.full != true && inputs.browser_spec || '' }}
        run: |
          npm --prefix frontend run build
          if [ -n "$E2E_SPEC" ]; then
            npm --prefix frontend run e2e -- "$E2E_SPEC"
          else
            npm --prefix frontend run e2e -- 23-topology-editing 21-management-width 25-workbench-hierarchy 26-visual-system 27-compact-chat 28-login-cascade 29-neutral-hierarchy 30-topology-theme-colors 31-topology-drawing-semantics 32-gentle-drag 33-topology-tool-groups 34-file-workspace 35-memory-context
          fi
      - name: Preserve browser visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-validation
          path: frontend/test-results/
          retention-days: 14

  test:
    if: github.event_name != 'workflow_dispatch' || inputs.full == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest harness/ -q --tb=short
          python scripts/platform_contract.py > /tmp/platform-contract.json
          python scripts/platform_runtime_check.py
          python scripts/run_platform_eval.py
          python scripts/check_extension_compatibility.py
          python scripts/verify_docs_runtime_consistency.py

  docker-isolation:
    if: github.event_name != 'workflow_dispatch' || inputs.full == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve immutable Python runner image
        run: |
          docker pull python:3.12-slim
          echo "LZCORE_PYTHON_CONTAINER_IMAGE=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Exercise real container security boundaries
        env:
          LZCORE_RUN_DOCKER_INTEGRATION: "1"
          LZCORE_RUNTIME_BIND_HOST: "0.0.0.0"
        run: |
          python -m pip install pytest
          python -m pytest harness/integration/test_docker_runner_integration.py -q --tb=short

  coding-isolation:
    if: github.event_name != 'workflow_dispatch' || inputs.full == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build generated-project-only runtime
        run: |
          python -m pip install -r requirements.txt
          scratch=$(mktemp -d)
          cp scripts/coding-runtime.Dockerfile "$scratch/Dockerfile"
          docker build -t lzcore-coding-runtime:local "$scratch"
          rm -rf "$scratch"
      - name: Exercise kernel isolation and independent evaluator separation
        run: |
          python scripts/verify_coding_isolation.py --output "$RUNNER_TEMP/coding-kernel" --rounds 3
          python scripts/verify_benchmark_evaluator.py --output "$RUNNER_TEMP/coding-evaluator"
      - name: Preserve kernel acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-kernel-validation
          path: |
            ${{ runner.temp }}/coding-kernel/report.json
            ${{ runner.temp }}/coding-evaluator/report.json
          retention-days: 14

  distributed-adapters:
    if: github.event_name != 'workflow_dispatch' || inputs.full == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lzcore
          POSTGRES_USER: lzcore
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lzcore -d lzcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Start S3-compatible object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio server /data || \
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnami/minio:latest server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - name: Exercise real distributed adapters
        env:
          LZCORE_RUN_DISTRIBUTED_INTEGRATION: "1"
          LZCORE_DATABASE_URL: postgresql://lzcore:integration-password@127.0.0.1:5432/lzcore
          LZCORE_QUEUE_URL: redis://127.0.0.1:6379/0
          LZCORE_EVENT_BUS_MODE: redis
          LZCORE_EVENT_BUS_URL: redis://127.0.0.1:6379/0
          LZCORE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          LZCORE_S3_ADDRESSING_STYLE: path
          LZCORE_OBJECT_STORE_BUCKET: lzcore-ci
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m pip install -r requirements.txt
          python -m pytest harness/integration/test_distributed_adapters_integration.py -q --tb=short

  production-profile:
    if: github.event_name != 'workflow_dispatch' || inputs.full == true
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: integration-password
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: integration-password
      GRAFANA_ADMIN_PASSWORD: integration-password
      LZCORE_MASTER_KEY_FILE: /dev/null
      LZCORE_SESSION_SECRET_FILE: /dev/null
      LZCORE_LOGIN_PASSWORD_FILE: /dev/null
      LZCORE_API_TOKEN_FILE: /dev/null
      LZCORE_TLS_CERT_FILE: /dev/null
      LZCORE_TLS_KEY_FILE: /dev/null
      LZCORE_DOCKER_SOCKET_GID: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Resolve production runner image and validate Compose
        run: |
          docker pull python:3.12-slim
          export LZCORE_PYTHON_CONTAINER_IMAGE="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          echo "LZCORE_PYTHON_CONTAINER_IMAGE=$LZCORE_PYTHON_CONTAINER_IMAGE" >> "$GITHUB_ENV"
          docker compose -f deployment/compose.production.yml config -q
      - name: Build production images and verify bundled Docker client
        run: |
          docker compose -f deployment/compose.production.yml build backend frontend
          docker run --rm lzcore-backend:latest docker --version

  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.full == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check . --select=E9,F821,F811 --exclude=__pycache__,.git,venv,node_modules
      - name: Check CSS tokens
        run: |
          python scripts/check_css_tokens.py

      - name: Check naming contract
        run: |
          python scripts/check_naming_contract.py

      - name: Check imports
        run: |
          python -c "
          import importlib, sys
          from pathlib import Path
          errors = []
          for f in Path('.').rglob('*.py'):
              if '.git' in str(f) or '__pycache__' in str(f) or 'venv' in str(f):
                  continue
              mod = str(f).replace('/', '.').replace('\\\\', '.').removesuffix('.py')
              try:
                  importlib.import_module(mod)
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors[:20]:
                  print(e)
              sys.exit(1)
          "

  windows-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.full == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Windows scripts and shell routing
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in @('start.ps1','stop.ps1','scripts/windows_update.ps1','scripts/windows_dialog_smoke.ps1','scripts/download_webview2.ps1','scripts/sign_windows.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
          python -m pytest harness/test_windows_runtime_contract.py harness/test_desktop_app.py harness/test_windows_desktop_update.py harness/test_llm_stream_tool_calls.py harness/test_synthesis_recovery.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\start.ps1 -NoBrowser -ValidateOnly
